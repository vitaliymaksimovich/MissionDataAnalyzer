<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёт о миссии</title>
    <style>
        @page { margin: 20mm; }
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: "Palatino Linotype", Georgia, serif;
            background: #e8e0d0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 0 60px 0;
        }

        .page {
            width: 210mm;
            background: #f5f0e8;
            box-shadow: 0 0 24px rgba(0,0,0,0.25);
            border: 1px solid #c8b89a;
        }

        /* шапка */
        .header {
            text-align: center;
            padding: 32px 40px 20px 40px;
            border-bottom: 2px solid #8a7a5a;
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            color: #3a4a2e;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 13px;
            color: #7a6a4a;
            letter-spacing: 1px;
        }

        /* декоративный разделитель */
        .divider {
            text-align: center;
            color: #8a7a5a;
            font-size: 18px;
            padding: 6px 0;
            letter-spacing: 8px;
        }

        /* тело отчёта */
        .report-body {
            padding: 24px 44px 36px 44px;
            color: #2e3a2e;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* подвал */
        .footer {
            border-top: 1px solid #c8b89a;
            padding: 12px 44px;
            text-align: right;
            font-size: 11px;
            color: #9a8a6a;
            font-style: italic;
        }

        @media print {
            html, body { background: white; padding: 0; }
            body { display: block; }
            .page { box-shadow: none; border: none; width: 100%; }
        }
    </style>
</head>
<body>
<div class="page">

    <div class="header">
        <div class="header-title">Отчёт о миссии</div>
        <div class="header-subtitle">Токийский магический колледж — Архив операций</div>
    </div>

    <div class="divider">✦ ✦ ✦</div>

    <div class="report-body">${reportText}</div>

    <div class="footer">
        Документ сформирован системой Mission Analyzer
    </div>

</div>
</body>
</html>
